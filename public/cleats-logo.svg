<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cleatBodyL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="cleatBodyR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="94" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-opacity="0.45" />

  <!-- Top Peg / Knot Where Laces Hang From -->
  <circle cx="256" cy="68" r="14" fill="url(#goldGrad)" />
  <!-- Tied Lace Bow Loops at Top -->
  <path d="M256 68 C225 42, 205 76, 250 74" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
  <path d="M256 68 C287 42, 307 76, 262 74" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />

  <!-- Hanging Shoelace Strings to Left and Right Cleats -->
  <path d="M252 74 Q212 135 178 198" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />
  <path d="M260 74 Q302 145 334 222" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />

  <!-- ================= LEFT HANGING CLEAT (Tilted Left, Hanging Vertical) ================= -->
  <g transform="translate(166, 290) rotate(-16)">
    <!-- Ankle Collar & Tongue -->
    <path d="M-28 -105 C-10 -115, 22 -110, 32 -92 L38 -52 L-34 -52 Z" fill="#1f2937" stroke="url(#goldGrad)" stroke-width="5" />
    <!-- Main Cleat Upper Body (Pointing Downward) -->
    <path d="M-38 -58 L38 -58 C46 -10, 48 52, 38 106 C32 132, 8 144, -14 140 C-36 136, -46 112, -44 74 C-42 28, -42 -18, -38 -58 Z" fill="url(#cleatBodyL)" stroke="#fde047" stroke-width="6" />
    <!-- Dynamic Speed Stripe on Cleat -->
    <path d="M-16 -36 C10 -4, 18 46, 10 105" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <path d="M4 -32 C22 -2, 28 42, 22 92" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" />
    <!-- Cleat Laces Along Front -->
    <line x1="14" y1="-40" x2="36" y2="-36" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="-18" x2="40" y2="-14" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="18" y1="4" x2="42" y2="8" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="18" y1="26" x2="42" y2="30" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <!-- Outer Sole Plate (Left Edge) -->
    <path d="M-40 -54 C-46 0, -48 64, -40 124" fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" />
    <!-- Molded Football Cleat Studs / Spikes -->
    <rect x="-58" y="-44" width="14" height="10" rx="3" fill="#fde047" />
    <rect x="-59" y="-20" width="14" height="10" rx="3" fill="#fde047" />
    <rect x="-60" y="16" width="14" height="10" rx="3" fill="#fde047" />
    <rect x="-60" y="44" width="14" height="10" rx="3" fill="#fde047" />
    <rect x="-59" y="72" width="14" height="10" rx="3" fill="#fde047" />
    <rect x="-56" y="100" width="14" height="10" rx="3" fill="#fde047" />
  </g>

  <!-- ================= RIGHT HANGING CLEAT (Slightly Lower, Tilted Right) ================= -->
  <g transform="translate(342, 314) rotate(14)">
    <!-- Ankle Collar & Tongue -->
    <path d="M-32 -92 C-22 -110, 10 -115, 28 -105 L34 -52 L-38 -52 Z" fill="#1f2937" stroke="url(#goldGrad)" stroke-width="5" />
    <!-- Main Cleat Upper Body -->
    <path d="M-38 -58 L38 -58 C42 -18, 42 28, 44 74 C46 112, 36 136, 14 140 C-8 144, -32 132, -38 106 C-48 52, -46 -10, -38 -58 Z" fill="url(#cleatBodyR)" stroke="#fde047" stroke-width="6" />
    <!-- Dynamic Speed Stripe on Cleat -->
    <path d="M16 -36 C-10 -4, -18 46, -10 105" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <path d="M-4 -32 C-22 -2, -28 42, -22 92" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" />
    <!-- Cleat Laces Along Front -->
    <line x1="-36" y1="-36" x2="-14" y2="-40" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="-40" y1="-14" x2="-16" y2="-18" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="-42" y1="8" x2="-18" y2="4" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="-42" y1="30" x2="-18" y2="26" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <!-- Outer Sole Plate (Right Edge) -->
    <path d="M40 -54 C46 0, 48 64, 40 124" fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" />
    <!-- Molded Football Cleat Studs / Spikes -->
    <rect x="44" y="-44" width="14" height="10" rx="3" fill="#fde047" />
    <rect x="45" y="-20" width="14" height="10" rx="3" fill="#fde047" />
    <rect x="46" y="16" width="14" height="10" rx="3" fill="#fde047" />
    <rect x="46" y="44" width="14" height="10" rx="3" fill="#fde047" />
    <rect x="45" y="72" width="14" height="10" rx="3" fill="#fde047" />
    <rect x="42" y="100" width="14" height="10" rx="3" fill="#fde047" />
  </g>
</svg>
