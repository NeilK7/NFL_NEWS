<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="turfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Outer App Icon Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- 100-Yard Football Field Frame -->
  <rect x="44" y="44" width="424" height="424" rx="80" fill="url(#turfGrad)" stroke="url(#goldGrad)" stroke-width="18" />

  <!-- Endzones -->
  <path d="M53 114 H459" stroke="#f59e0b" stroke-width="8" />
  <path d="M53 398 H459" stroke="#f59e0b" stroke-width="8" />

  <!-- Yard Lines Across the 100-Yard Field -->
  <g stroke="#ffffff" stroke-opacity="0.78" stroke-width="5">
    <line x1="56" y1="160" x2="456" y2="160" />
    <line x1="56" y1="208" x2="456" y2="208" />
    <line x1="56" y1="256" x2="456" y2="256" stroke="#fde047" stroke-opacity="0.95" stroke-width="8" />
    <line x1="56" y1="304" x2="456" y2="304" />
    <line x1="56" y1="352" x2="456" y2="352" />
  </g>

  <!-- Left & Right Hash Marks -->
  <g stroke="#ffffff" stroke-opacity="0.65" stroke-width="4" stroke-linecap="round">
    <line x1="172" y1="136" x2="194" y2="136" />
    <line x1="172" y1="184" x2="194" y2="184" />
    <line x1="172" y1="232" x2="194" y2="232" />
    <line x1="172" y1="280" x2="194" y2="280" />
    <line x1="172" y1="328" x2="194" y2="328" />
    <line x1="172" y1="376" x2="194" y2="376" />
    <line x1="318" y1="136" x2="340" y2="136" />
    <line x1="318" y1="184" x2="340" y2="184" />
    <line x1="318" y1="232" x2="340" y2="232" />
    <line x1="318" y1="280" x2="340" y2="280" />
    <line x1="318" y1="328" x2="340" y2="328" />
    <line x1="318" y1="376" x2="340" y2="376" />
  </g>

  <!-- Gold Goalpost at Top Endzone -->
  <g stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="256" y1="114" x2="256" y2="90" />
    <line x1="206" y1="90" x2="306" y2="90" />
    <line x1="206" y1="90" x2="206" y2="58" />
    <line x1="306" y1="90" x2="306" y2="58" />
  </g>

  <!-- Center 100-YARDS Shield Badge -->
  <rect x="116" y="188" width="280" height="136" rx="34" fill="#090d16" fill-opacity="0.92" stroke="url(#goldGrad)" stroke-width="10" />
  <text x="256" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif" font-weight="900" font-size="82" fill="url(#goldGrad)" letter-spacing="2">100</text>
  <text x="256" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif" font-weight="800" font-size="30" fill="#ffffff" letter-spacing="8">YARDS</text>
</svg>
